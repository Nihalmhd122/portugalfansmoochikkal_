<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kerala Disaster Alert</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f8;
}

header{
    background:#d32f2f;
    color:white;
    text-align:center;
    padding:20px;
}

.card{
    background:white;
    margin:15px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

h2{
    margin-top:0;
}

.alert{
    background:#ffeb3b;
    padding:10px;
    border-radius:8px;
    font-weight:bold;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    cursor:pointer;
}

footer{
    text-align:center;
    padding:15px;
    color:#666;
}
</style>
</head>

<body>

<header>
    <h1>🌧 Kerala Disaster Alert</h1>
    <p>Weather • Flood • Emergency Updates</p>
</header>

<div class="card">
    <h2>⚠ Current Alert</h2>
    <div class="alert">
        No Active Alert
    </div>
</div>

<div class="card">
    <h2>🌦 Live Weather</h2>
    <p id="temp">Loading temperature...</p>
    <p id="wind">Loading wind speed...</p>
</div>

<div class="card">
    <h2>📞 Emergency Numbers</h2>
    <p>Police : 100</p>
    <p>Fire Force : 101</p>
    <p>Ambulance : 108</p>
    <p>Disaster Management : 1077</p>
</div>

<div class="card">
    <h2>📍 Location</h2>
    <button onclick="getLocation()">Detect My Location</button>
    <p id="location"></p>
</div>

<footer>
    Kerala Disaster Alert © 2026
</footer>

<script>
async function getWeather() {
    try {
        const response = await fetch(
        "https://api.open-meteo.com/v1/forecast?latitude=10.85&longitude=76.27&current=temperature_2m,wind_speed_10m");

        const data = await response.json();

        document.getElementById("temp").innerHTML =
            "🌡 Temperature: " + data.current.temperature_2m + " °C";

        document.getElementById("wind").innerHTML =
            "💨 Wind Speed: " + data.current.wind_speed_10m + " km/h";

    } catch(error) {
        document.getElementById("temp").innerHTML =
            "Weather data unavailable";
    }
}

function getLocation() {
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(position){
            document.getElementById("location").innerHTML =
            "Latitude: " +
            position.coords.latitude +
            "<br>Longitude: " +
            position.coords.longitude;
        });
    } else {
        document.getElementById("location").innerHTML =
        "Location not supported";
    }
}

getWeather();
</script>

</body>
</html>
